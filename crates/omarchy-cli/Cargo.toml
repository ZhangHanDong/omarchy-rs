[package]
name = "omarchy-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "omarchy-rs"
path = "src/main.rs"

[dependencies]
omarchy-compat = { path = "../omarchy-compat" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"

[dev-dependencies]
tempfile = "3.27.0"
