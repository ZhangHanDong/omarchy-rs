[package]
name = "omarchy-agents"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
ccusage-adapter-codex = { version = "=0.0.0", git = "https://github.com/ZhangHanDong/ccusage", rev = "97f5b4e71864408c4df5a9758639d253caf57dce" }
ccusage-core = { version = "=0.0.0", git = "https://github.com/ZhangHanDong/ccusage", rev = "97f5b4e71864408c4df5a9758639d253caf57dce", features = ["models-dev-pricing-only"] }
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
tempfile = "3.27.0"
