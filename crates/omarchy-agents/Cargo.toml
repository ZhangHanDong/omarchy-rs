[package]
name = "omarchy-agents"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
ccusage-adapter-codex = { version = "=0.0.0", git = "https://github.com/ZhangHanDong/ccusage", rev = "03d8f07b867521cb74dd48af0379b3ffdc413c94" }
ccusage-core = { version = "=0.0.0", git = "https://github.com/ZhangHanDong/ccusage", rev = "03d8f07b867521cb74dd48af0379b3ffdc413c94", features = ["models-dev-pricing-only"] }
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
tempfile = "3.27.0"
